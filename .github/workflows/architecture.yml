name: architecture-guardrails

on:
  push:
  pull_request:

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify architecture fitness functions
        run: python3 scripts/check_architecture_fitness.py
      - name: Verify Why backend guardrail
        run: python3 scripts/check_why_backend_guardrail.py
